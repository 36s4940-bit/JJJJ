<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Toilet Flushing Detector | IN And OUT</title>
    <!-- 마리오 분위기를 위한 픽셀 폰트 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Galmuri14&display=swap" rel="stylesheet">
    <style>
        :root {
            --mario-red: #E52521;
            --mario-blue: #002244;
            --mario-yellow: #FBD000;
            --mario-green: #43B047;
            --mario-sky: #5C94FC;
            --mario-ground: #C84C0C;
            --box-bg: #202020;
            --text-color: #FFFFFF;
            --pixel-border: 4px solid #000;
        }

        * {
            box-sizing: border-box;
            image-rendering: pixelated;
        }

        body {
            font-family: 'Galmuri14', 'Press Start 2P', sans-serif;
            background-color: var(--mario-sky);
            color: var(--text-color);
            margin: 0;
            padding: 20px 10px;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: #000;
            border: 4px solid #FFF;
            box-shadow: 0 0 0 4px #000, 8px 8px 0px rgba(0,0,0,0.5);
            padding: 25px;
            position: relative;
        }

        /* 게이트(초기 확인) 화면 스타일 */
        #gate-screen {
            text-align: center;
            padding: 20px 10px;
        }

        .mario-title {
            font-family: 'Press Start 2P', cursive;
            color: var(--mario-yellow);
            text-shadow: 3px 3px 0px var(--mario-red);
            font-size: 1.2rem;
            margin-bottom: 20px;
            word-break: break-word;
        }

        .question-box {
            background-color: var(--mario-red);
            border: 4px solid #FFF;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 4px 4px 0px #000;
        }

        .question-box p {
            margin: 0;
            font-size: 1.1rem;
            color: #FFF;
            font-weight: bold;
        }

        /* 큰 픽셀 변기 일러스트 */
        .pixel-toilet-container {
            margin: 20px 0;
            display: flex;
            justify-content: center;
        }

        .pixel-toilet {
            width: 120px;
            height: 140px;
            position: relative;
        }

        /* SVG 영역 */
        .toilet-svg {
            width: 120px;
            height: 140px;
        }

        /* 게이트 버튼 및 말풍선 영역 */
        .gate-buttons-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        /* '아니오' 위에 뜨는 픽셀 말풍선 */
        .speech-bubble {
            position: absolute;
            bottom: 100%;
            right: 15%;
            margin-bottom: 12px;
            background-color: #FFF;
            color: #000;
            padding: 8px 12px;
            font-size: 0.8rem;
            font-weight: bold;
            border: 3px solid #000;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.4);
            white-space: nowrap;
            display: none;
            z-index: 10;
        }

        /* 말풍선 꼬리 */
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            right: 25px;
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 8px solid #000;
        }

        .gate-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .mario-btn {
            font-family: 'Galmuri14', sans-serif;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 12px 24px;
            border: 4px solid #000;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            transition: transform 0.1s;
        }

        .mario-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000;
        }

        .btn-yes {
            background-color: var(--mario-green);
            color: #FFF;
        }

        .btn-no {
            background-color: var(--mario-red);
            color: #FFF;
        }

        /* 메인 콘텐츠 화면 (초기 숨김) */
        #main-content {
            display: none;
        }

        header {
            text-align: center;
            border-bottom: 4px solid #FFF;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0 0 10px 0;
            font-size: 1.4rem;
            color: var(--mario-yellow);
            text-shadow: 2px 2px 0px var(--mario-red);
        }

        header p {
            margin: 0;
            font-size: 0.9rem;
            color: #DDD;
        }

        section {
            margin-bottom: 25px;
        }

        h2 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: var(--mario-yellow);
            border-left: 4px solid var(--mario-red);
            padding-left: 8px;
        }

        .model-section {
            background-color: #1a1a2e;
            padding: 20px;
            border: 4px solid var(--mario-sky);
        }

        #status {
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            color: var(--mario-yellow);
            min-height: 24px;
            font-size: 0.9rem;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            font-size: 0.95rem;
            color: #FFF;
            background-color: var(--mario-green);
            min-width: 120px;
        }

        .action-btn:disabled {
            background-color: #555;
            cursor: not-allowed;
            box-shadow: none;
        }

        .action-btn.stop-btn {
            background-color: var(--mario-red);
        }

        .file-upload {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px dashed var(--mario-sky);
        }

        .file-upload label {
            display: block;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #FFF;
        }

        .file-upload input[type="file"] {
            width: 100%;
            padding: 5px 0;
            color: #FFF;
            font-family: inherit;
        }

        audio {
            width: 100%;
            margin-top: 10px;
        }

        .results-container {
            margin-top: 20px;
            min-height: 120px;
        }

        .bar-container {
            display: flex;
            align-items: center;
            margin: 10px 0;
        }

        .bar-label {
            width: 110px;
            font-size: 0.8rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bar-track {
            flex-grow: 1;
            height: 20px;
            background-color: #333;
            border: 2px solid #FFF;
            margin: 0 10px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background-color: var(--mario-yellow);
            width: 0%;
            transition: width 0.1s ease-out;
        }

        .bar-percent {
            width: 45px;
            font-size: 0.8rem;
            text-align: right;
            font-weight: bold;
        }

        .top-prediction {
            margin-top: 15px;
            text-align: center;
            padding: 15px;
            background-color: #332a00;
            border: 2px solid var(--mario-yellow);
            color: var(--mario-yellow);
        }

        .top-prediction strong {
            font-size: 1.1rem;
            color: #FFF;
        }

        .top-prediction small {
            display: block;
            margin-top: 5px;
            font-size: 0.75rem;
            color: #AAA;
        }

        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.8rem;
            color: #AAA;
            border-top: 2px solid #333;
            padding-top: 15px;
        }

        .audio-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 0.7rem;
            color: var(--mario-yellow);
            background: rgba(0,0,0,0.7);
            padding: 4px 8px;
            border: 1px solid var(--mario-yellow);
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- 1단계: 한영외고 재학생 여부 확인 게이트 화면 -->
        <div id="gate-screen">
            <div class="audio-indicator" id="bgm-status">🎵 BGM 준비됨 (클릭 시 재생)</div>

            <div class="pixel-toilet-container">

        <!-- 2단계: 메인 애플리케이션 화면 -->
        <div id="main-content">
            <header>
                <h1>변기 물내림 구별 프로그램</h1>
                <p>화장실 에티켓을 돕는 AI 소리 분류기</p>

            <section class="model-section">
                <h2>모델 체험하기</h2>

                <div class="controls">
                    <button id="btn-mic" class="mario-btn action-btn">마이크 시작</button>
                    <button id="btn-stop" class="mario-btn action-btn stop-btn" disabled>중지</button>

                <div class="file-upload">
                    <label for="audio-upload">또는 오디오 파일로 확인하기:</label>
                    <input type="file" id="audio-upload" accept="audio/*">
                    <audio id="audio-player" controls style="display:none;"></audio>

                <div id="results" class="results-container"></div>

                <div id="top-prediction" class="top-prediction" style="display: none;"></div>

    </div>

    <!-- TensorFlow.js 및 Speech Commands 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>

    <script>
        // --- 마리오 BGM (Web Audio API Synthesizer) ---
        let audioCtx = null;
        let isBgmPlaying = false;
        let bgmTimeoutId = null;

        const marioNotes = [
            {f: 659.25, d: 0.15}, {f: 659.25, d: 0.15}, {f: 0, d: 0.15}, {f: 659.25, d: 0.15},
            {f: 0, d: 0.15}, {f: 523.25, d: 0.15}, {f: 659.25, d: 0.3}, {f: 783.99, d: 0.3},
            {f: 0, d: 0.3}, {f: 392.00, d: 0.3}, {f: 0, d: 0.3},
            {f: 523.25, d: 0.3}, {f: 0, d: 0.15}, {f: 392.00, d: 0.3}, {f: 0, d: 0.15},
            {f: 329.63, d: 0.3}, {f: 0, d: 0.15}, {f: 440.00, d: 0.2}, {f: 493.88, d: 0.2},
            {f: 466.16, d: 0.15}, {f: 440.00, d: 0.3}, {f: 392.00, d: 0.2}, {f: 659.25, d: 0.2},
            {f: 783.99, d: 0.2}, {f: 880.00, d: 0.3}, {f: 698.46, d: 0.15}, {f: 783.99, d: 0.15},
            {f: 0, d: 0.15}, {f: 659.25, d: 0.3}, {f: 523.25, d: 0.15}, {f: 587.33, d: 0.15},
            {f: 493.88, d: 0.3}
        ];

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playNote(freq, duration, startTime) {
            if (freq === 0) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, startTime);
            
            gain.gain.setValueAtTime(0.08, startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration - 0.02);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start(startTime);
            osc.stop(startTime + duration);
        }

        function startMarioBGM() {
            initAudioContext();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            if (isBgmPlaying) return;
            isBgmPlaying = true;
            document.getElementById('bgm-status').innerText = "🎶 마리오 BGM 재생 중";

            function playLoop() {
                if (!isBgmPlaying) return;
                let now = audioCtx.currentTime;
                let totalDuration = 0;

                marioNotes.forEach(note => {
                    playNote(note.f, note.d, now + totalDuration);
                    totalDuration += note.d;
                });

                bgmTimeoutId = setTimeout(() => {
                    if (isBgmPlaying) playLoop();
                }, totalDuration * 1000);
            }

            playLoop();
        }

        function stopMarioBGM() {
            isBgmPlaying = false;
            if (bgmTimeoutId) clearTimeout(bgmTimeoutId);
        }

        document.body.addEventListener('click', function startAudioOnInteraction() {
            if (!isBgmPlaying && document.getElementById('gate-screen').style.display !== 'none') {
                startMarioBGM();
            }
        }, { once: true });

        // --- 게이트 화면 로직 ---
        const gateScreen = document.getElementById('gate-screen');
        const mainContent = document.getElementById('main-content');
        const btnYes = document.getElementById('btn-yes');
        const btnNo = document.getElementById('btn-no');
        const noBubble = document.getElementById('no-bubble');

        function enterApp() {
            stopMarioBGM();
            gateScreen.style.display = 'none';
            mainContent.style.display = 'block';
        }

        btnYes.addEventListener('click', enterApp);

        // '아니오' 클릭 시 말풍선 표시 및 시간 지연 후 이동
        btnNo.addEventListener('click', () => {
            noBubble.style.display = 'block';
            setTimeout(() => {
                enterApp();
            }, 1800);
        });

        // --- 머신러닝 AI 분석 로직 ---
        const URL = "https://teachablemachine.withgoogle.com/models/KehN6RK0T/";
        
        let recognizer;
        let isPredicting = false;
        let currentObjectURL = null;

        const statusEl = document.getElementById('status');
        const btnMic = document.getElementById('btn-mic');
        const btnStop = document.getElementById('btn-stop');
        const fileInput = document.getElementById('audio-upload');
        const audioPlayer = document.getElementById('audio-player');
        const resultsEl = document.getElementById('results');
        const topPredEl = document.getElementById('top-prediction');

        async function loadModel() {
            if (recognizer) return true;
            
            statusEl.innerText = "모델을 불러오는 중입니다... 잠시만 기다려주세요.";
            try {
                const checkpointURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";

                recognizer = speechCommands.create(
                    "BROWSER_FFT",
                    undefined,
                    checkpointURL,
                    metadataURL
                );

                await recognizer.ensureModelLoaded();
                initResultBars(recognizer.wordLabels());
                return true;
            } catch (error) {
                statusEl.innerText = "오류: 모델을 불러오지 못했습니다. 주소를 확인해주세요.";
                console.error(error);
                return false;
            }
        }

        function initResultBars(labels) {
            resultsEl.innerHTML = '';
            labels.forEach((label, index) => {
                const container = document.createElement('div');
                container.className = 'bar-container';

                const labelDiv = document.createElement('div');
                labelDiv.className = 'bar-label';
                labelDiv.innerText = label;

                const trackDiv = document.createElement('div');
                trackDiv.className = 'bar-track';

                const fillDiv = document.createElement('div');
                fillDiv.className = 'bar-fill';
                fillDiv.id = `bar-fill-${index}`;

                const percentDiv = document.createElement('div');
                percentDiv.className = 'bar-percent';
                percentDiv.id = `bar-percent-${index}`;
                percentDiv.innerText = '0%';

                trackDiv.appendChild(fillDiv);
                container.appendChild(labelDiv);
                container.appendChild(trackDiv);
                container.appendChild(percentDiv);
                resultsEl.appendChild(container);
            });
        }

        function renderResults(scores) {
            const labels = recognizer.wordLabels();
            let maxScore = 0;
            let maxLabel = '';

            for (let i = 0; i < labels.length; i++) {
                const score = scores[i];
                const percent = (score * 100).toFixed(0);
                
                document.getElementById(`bar-fill-${i}`).style.width = percent + '%';
                document.getElementById(`bar-percent-${i}`).innerText = percent + '%';

                if (score > maxScore) {
                    maxScore = score;
                    maxLabel = labels[i];
                }
            }

            topPredEl.style.display = 'block';
            topPredEl.innerHTML = `가장 높은 확률: <strong>${maxLabel}</strong><br><small>(주의: 가장 높은 확률이 반드시 정답은 아닙니다.)</small>`;
        }

        function stopPredicting() {
            if (isPredicting && recognizer) {
                try {
                    recognizer.stopListening();
                } catch (e) {
                    console.log("Listening 멈춤 오류 무시:", e);
                }
                isPredicting = false;
            }
            audioPlayer.pause();
            btnMic.disabled = false;
            btnStop.disabled = true;
            statusEl.innerText = "분석이 중지되었습니다. 다시 시작하려면 버튼을 누르세요.";
        }

        btnMic.addEventListener('click', async () => {
            if (isPredicting) return;
            
            fileInput.value = ''; 
            audioPlayer.style.display = 'none';

            const loaded = await loadModel();
            if (!loaded) return;

            try {
                statusEl.innerText = "마이크 권한을 확인 중입니다...";
                
                await recognizer.listen(result => {
                    renderResults(result.scores);
                }, {
                    includeSpectrogram: true,
                    probabilityThreshold: 0.75,
                    invokeCallbackOnNoiseAndUnknown: true,
                    overlapFactor: 0.50
                });

                isPredicting = true;
                btnMic.disabled = true;
                btnStop.disabled = false;
                statusEl.innerText = "마이크로 실시간 소리를 분석 중입니다.";
            } catch (err) {
                statusEl.innerText = "오류: 마이크 권한이 거부되었거나 장치를 사용할 수 없습니다.";
                console.error(err);
            }
        });

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            if (!file.type.startsWith('audio/')) {
                statusEl.innerText = "오류: 올바른 오디오 파일 형식이 아닙니다.";
                fileInput.value = '';
                return;
            }

            stopPredicting();
            if (currentObjectURL) {
                URL.revokeObjectURL(currentObjectURL);
            }

            const loaded = await loadModel();
            if (!loaded) return;

            currentObjectURL = URL.createObjectURL(file);
            audioPlayer.src = currentObjectURL;
            audioPlayer.style.display = 'block';
            
            const captureMethod = audioPlayer.captureStream || audioPlayer.mozCaptureStream;
            
            if (captureMethod) {
                const stream = captureMethod.call(audioPlayer);
                const originalGUM = navigator.mediaDevices.getUserMedia;
                
                navigator.mediaDevices.getUserMedia = () => Promise.resolve(stream);

                try {
                    statusEl.innerText = "오디오 파일을 분석 중입니다...";
                    await audioPlayer.play();
                    
                    await recognizer.listen(result => {
                        renderResults(result.scores);
                    }, {
                        includeSpectrogram: true,
                        probabilityThreshold: 0.75,
                        invokeCallbackOnNoiseAndUnknown: true,
                        overlapFactor: 0.50
                    });

                    isPredicting = true;
                    btnMic.disabled = false;
                    btnStop.disabled = false;
                    
                    audioPlayer.onended = stopPredicting;
                } catch (err) {
                    statusEl.innerText = "오류: 오디오 파일을 분석할 수 없습니다.";
                    console.error(err);
                } finally {
                    navigator.mediaDevices.getUserMedia = originalGUM;
                }
            } else {
                statusEl.innerText = "오류: 현재 브라우저 환경에서는 오디오 파일 실시간 분석을 지원하지 않습니다. 마이크 입력을 사용해주세요.";
            }
        });

        btnStop.addEventListener('click', stopPredicting);
    </script>
</body>
</html>
